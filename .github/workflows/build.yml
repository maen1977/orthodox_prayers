name: Build

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Build and publish a protected signed release"
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  android_debug:
    name: Build Android debug
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Normalize Gradle wrapper permission
        run: python scripts/ensure_gradlew_executable.py

      - name: Run source and religious-content quality gate
        run: python scripts/run_quality_gate.py --strict-native-lanes

      - name: Import latest signed published data for debug APK
        shell: bash
        run: |
          set -euo pipefail
          VERIFIED_DIR="$RUNNER_TEMP/verified-data-debug"
          if git fetch --force origin verified-data; then
            git worktree add --force --detach "$VERIFIED_DIR" origin/verified-data
            trap 'git worktree remove --force "$VERIFIED_DIR" >/dev/null 2>&1 || true' EXIT
            # verified-data from releases before R18.2 may still contain obsolete
            # top-level calendar aliases. Remove them only in this detached import
            # worktree before strict verification; the Update workflow will delete
            # them permanently from the published branch on its next successful run.
            python scripts/clean_legacy_calendar_snapshots.py --root "$VERIFIED_DIR"
            PUBLISHED_DATE="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["date_iso"])' "$VERIFIED_DIR/data/calendar/today.json")"
            if python scripts/validate_verified_data_contract.py --root "$VERIFIED_DIR" --expected-date "$PUBLISHED_DATE"; then
              rsync -a --delete "$VERIFIED_DIR/data/" data/
              rsync -a --delete "$VERIFIED_DIR/app/src/main/assets/data/" app/src/main/assets/data/
              # Published data may contain snapshots of static service libraries from an
              # older release. Runtime data is imported from verified-data, but structural
              # service metadata must always come from the checked-out application source.
              git restore --source=HEAD --worktree -- \
                data/services/library.json \
                data/services/native \
                app/src/main/assets/data/library.json \
                app/src/main/assets/data/native
              python -m pytest -q tests/test_native_service_category_alignment.py
              python scripts/verify.py --expected-date "$PUBLISHED_DATE" --allow-missing-manifest --allow-compatible-manifest-version --allow-legacy-multilingual-lanes
              git worktree remove --force "$VERIFIED_DIR"
              trap - EXIT
            else
              echo "::warning title=verified-data requires a nine-day upgrade::Published data date $PUBLISHED_DATE uses an incompatible rolling-window contract. Building debug with the signed embedded bootstrap; the next scheduled Rolling Liturgical Window Update will republish verified-data with the fixed nine-day contract."
              git worktree remove --force "$VERIFIED_DIR"
              trap - EXIT
              python scripts/verify_data_signature.py
              python scripts/validate_embedded_app_data.py
            fi
          else
            echo "::warning::verified-data does not exist yet; building debug with the signed embedded bootstrap. Run Update once to create the moving publication branch."
            python scripts/verify_data_signature.py
            python scripts/validate_embedded_app_data.py
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Android unit tests
        run: ./gradlew --no-daemon testDebugUnitTest --stacktrace

      - name: Android debug lint
        run: ./gradlew --no-daemon lintDebug --stacktrace

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Prepare branded debug APK
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path("app/build.gradle.kts").read_text(encoding="utf-8")
          match = re.search(r'versionName\s*=\s*"([^"]+)"', text)
          if not match:
              raise SystemExit("versionName not found")
          print(match.group(1))
          PY
          )"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          mkdir -p release/checksums
          cp app/build/outputs/apk/debug/app-debug.apk "release/Church-Prayers-$APP_VERSION-debug.apk"
          sha256sum "release/Church-Prayers-$APP_VERSION-debug.apk" > release/checksums/SHA256SUMS.txt

      - name: Upload Church Prayers debug APK and reports
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: Church-Prayers-${{ env.APP_VERSION }}-debug-${{ github.run_number }}
          path: |
            release/Church-Prayers-${{ env.APP_VERSION }}-debug.apk
            release/branding/Church-Prayers.ico
            release/branding/Church-Prayers-icon-512.png
            app/build/reports/lint-results-debug.html
            release/checksums/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  release:
    name: Protected signed APK and AAB
    needs: android_debug
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Import latest signed verified data
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin verified-data
          VERIFIED_DIR="$RUNNER_TEMP/verified-data"
          git worktree add --force --detach "$VERIFIED_DIR" origin/verified-data
          python scripts/clean_legacy_calendar_snapshots.py --root "$VERIFIED_DIR"
          PUBLISHED_DATE="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["date_iso"])' "$VERIFIED_DIR/data/calendar/today.json")"
          python scripts/validate_verified_data_contract.py --root "$VERIFIED_DIR" --expected-date "$PUBLISHED_DATE"
          rsync -a --delete "$VERIFIED_DIR/data/" data/
          rsync -a --delete "$VERIFIED_DIR/app/src/main/assets/data/" app/src/main/assets/data/
          # Published data may contain snapshots of static service libraries from an
          # older release. Runtime data is imported from verified-data, but structural
          # service metadata must always come from the checked-out application source.
          git restore --source=HEAD --worktree -- \
            data/services/library.json \
            data/services/native \
            app/src/main/assets/data/library.json \
            app/src/main/assets/data/native
          python -m pytest -q tests/test_native_service_category_alignment.py
          git worktree remove --force "$VERIFIED_DIR"
          echo "ORTHODOX_DATE=$(TZ=Asia/Amman date +%F)" >> "$GITHUB_ENV"

      - name: Normalize Gradle wrapper permission
        run: python scripts/ensure_gradlew_executable.py

      - name: Run release-strict quality gate
        run: |
          python scripts/run_quality_gate.py --require-current --strict-native-lanes
          python scripts/validate_release_readiness.py
          python scripts/validate_service_edition_evidence.py
          python scripts/validate_all_services_completion_round.py --production
          python scripts/validate_religious_completeness.py
          python scripts/validate_play_store_assets.py --require-screenshots

      - name: Set up JDK 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Resolve release version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          fi
          test -n "$VERSION"
          APP_VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          test "$VERSION" = "$APP_VERSION" || { echo "Tag/version mismatch: $VERSION != $APP_VERSION" >&2; exit 1; }
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Restore protected Android signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in ANDROID_KEYSTORE_B64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            test -n "${!value}" || { echo "$value is required" >&2; exit 1; }
          done
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/orthodox-release.keystore"
          chmod 600 "$RUNNER_TEMP/orthodox-release.keystore"
          keytool -list -keystore "$RUNNER_TEMP/orthodox-release.keystore" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/orthodox-release.keystore" >> "$GITHUB_ENV"

      - name: Build signed release APK and AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon clean testDebugUnitTest lintRelease assembleRelease bundleRelease --stacktrace

      - name: Generate dependency report, SBOM, and clean source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          ./gradlew --no-daemon app:dependencies --configuration releaseRuntimeClasspath > release/RELEASE_DEPENDENCIES.txt
          python scripts/generate_sbom.py --gradle-report release/RELEASE_DEPENDENCIES.txt --output release/Church-Prayers-$RELEASE_VERSION-sbom.cdx.json
          python scripts/create_clean_source_archive.py --prefix Church-Prayers-$RELEASE_VERSION-source --output release/Church-Prayers-$RELEASE_VERSION-source.zip

      - name: Verify and collect release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk "release/Church-Prayers-$RELEASE_VERSION.apk"
          cp app/build/outputs/bundle/release/app-release.aab "release/Church-Prayers-$RELEASE_VERSION.aab"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "release/Church-Prayers-$RELEASE_VERSION.apk"
          (cd release && find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\0' | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: Church-Prayers-${{ env.RELEASE_VERSION }}-signed
          path: release/
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release for tags
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/orthodox-release.keystore"
