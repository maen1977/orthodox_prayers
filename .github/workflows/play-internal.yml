name: Play Internal Testing

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Successful Build workflow run id"
        required: true
        type: string
      version:
        description: "Exact app version, for example 5.2.0"
        required: true
        type: string
      publish:
        description: "Commit the AAB to the protected internal track"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: play-internal-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Download protected signed release artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "${{ inputs.build_run_id }}" \
            --repo "$GITHUB_REPOSITORY" \
            --name "Church-Prayers-${{ inputs.version }}-signed" \
            --dir release/downloaded
          find release/downloaded -type f -maxdepth 3 -print
      - name: Locate and validate the AAB
        run: |
          set -euo pipefail
          AAB="$(find release/downloaded -type f -name 'Church-Prayers-${{ inputs.version }}.aab' -print -quit)"
          test -n "$AAB"
          python scripts/validate_release_size.py --aab "$AAB" --report release/play-internal-size.json
          python scripts/upload_play_internal.py \
            --aab "$AAB" \
            --release-name "Church Prayers ${{ inputs.version }}" \
            --dry-run \
            --report release/play-internal-validation.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: play-internal-validation-${{ inputs.version }}
          path: release/*.json
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: validate
    if: inputs.publish == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: play-internal
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-release.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-release.txt
      - name: Download protected signed release artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "${{ inputs.build_run_id }}" \
            --repo "$GITHUB_REPOSITORY" \
            --name "Church-Prayers-${{ inputs.version }}-signed" \
            --dir release/downloaded
      - name: Restore Google Play service account
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$PLAY_SERVICE_ACCOUNT_JSON"
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play-service-account.json"
          chmod 600 "$RUNNER_TEMP/play-service-account.json"
      - name: Publish to the internal testing track
        run: |
          set -euo pipefail
          AAB="$(find release/downloaded -type f -name 'Church-Prayers-${{ inputs.version }}.aab' -print -quit)"
          test -n "$AAB"
          python scripts/upload_play_internal.py \
            --service-account "$RUNNER_TEMP/play-service-account.json" \
            --aab "$AAB" \
            --track internal \
            --status completed \
            --release-name "Church Prayers ${{ inputs.version }}" \
            --report release/play-internal-upload.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: play-internal-upload-${{ inputs.version }}
          path: release/play-internal-upload.json
          if-no-files-found: error
          retention-days: 90
      - if: always()
        run: rm -f "$RUNNER_TEMP/play-service-account.json"
