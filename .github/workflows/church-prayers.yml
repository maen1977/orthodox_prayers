name: Church Prayers

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Build the app or update today's prayers"
        required: true
        default: build
        type: choice
        options: [build, update, verify]
      date:
        description: "Optional Asia/Amman date for the daily update (YYYY-MM-DD)"
        required: false
        type: string
      window_days:
        description: "Daily reading window (fixed at 9 days)"
        required: false
        default: "9"
        type: string
  push:
    branches: [main]
  schedule:
    # 04:23 and 16:43 in Asia/Amman (UTC+3).
    - cron: "23 1 * * *"
    - cron: "43 13 * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: church-prayers-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  VERIFIED_DATA_BRANCH: verified-data
  ORTHODOX_ENABLE_LIVE_SOURCE_FETCH: "1"
  ORTHODOX_ROLLING_WINDOW_DAYS: "9"

jobs:
  build:
    name: Build Church Prayers
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'build')
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Get project
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Keep one Church Prayers workflow
        run: python scripts/keep_one_workflow.py

      - name: Save the one-workflow cleanup
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/workflows; then
            echo "Only church-prayers.yml is present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows
          git commit -m "Keep one Church Prayers workflow"
          git push origin HEAD:main

      - name: Prepare Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install checks
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Check content, languages, security, and calendar
        run: python scripts/simple_quality_gate.py

      - name: Prepare Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Check Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Prepare optional release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          python scripts/ensure_gradlew_executable.py
          if [[ -n "${ANDROID_KEYSTORE_B64:-}" && -n "${ANDROID_KEYSTORE_PASSWORD:-}" && -n "${ANDROID_KEY_ALIAS:-}" && -n "${ANDROID_KEY_PASSWORD:-}" ]]; then
            printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/church-prayers.keystore"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/church-prayers.keystore" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Release signing enabled."
          else
            echo "Release signing secrets are not configured; the installable APK will use the debug key."
          fi

      - name: Test and build the app
        run: ./gradlew --no-daemon testDebugUnitTest lintRelease assembleDebug assembleRelease bundleRelease --stacktrace

      - name: Prepare the two final files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output

          if [[ -f app/build/outputs/apk/release/app-release.apk ]]; then
            cp app/build/outputs/apk/release/app-release.apk output/Church-Prayers.apk
          else
            cp app/build/outputs/apk/debug/app-debug.apk output/Church-Prayers.apk
          fi

          cp app/build/outputs/bundle/release/app-release.aab output/Church-Prayers.aab
          test -s output/Church-Prayers.apk
          test -s output/Church-Prayers.aab

          {
            echo "## Church Prayers is ready"
            echo "Download the **Church-Prayers** artifact. It contains only:"
            echo "- Church-Prayers.apk"
            echo "- Church-Prayers.aab"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Church Prayers
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: Church-Prayers
          path: |
            output/Church-Prayers.apk
            output/Church-Prayers.aab
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/church-prayers.keystore"

  daily:
    name: Update Daily Prayers
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'build')
    # Store DATA_SIGNING_PRIVATE_KEY_B64 in this protected Environment, not as
    # an unrestricted repository secret. The private key is materialized only
    # after all external-source fetching and unsigned validation have finished.
    environment: production-data-signing
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Resolve mode and date
        id: resolve
        shell: bash
        env:
          INPUT_MODE: ${{ github.event.inputs.mode }}
          INPUT_DATE: ${{ github.event.inputs.date }}
          INPUT_WINDOW_DAYS: ${{ github.event.inputs.window_days }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_MODE:-}" ]]; then MODE="$INPUT_MODE"; else MODE=update; fi
          if [[ -n "${INPUT_DATE:-}" ]]; then DATE="$INPUT_DATE"; else DATE="$(TZ=Asia/Amman date +%F)"; fi
          [[ "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          WINDOW_DAYS="${INPUT_WINDOW_DAYS:-$ORTHODOX_ROLLING_WINDOW_DAYS}"
          [[ "$WINDOW_DAYS" =~ ^[0-9]+$ ]]
          (( WINDOW_DAYS == 9 )) || { echo "window_days must be exactly 9" >&2; exit 1; }
          REVISION=$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "window_days=$WINDOW_DAYS" >> "$GITHUB_OUTPUT"

      - name: Checkout source
        if: steps.resolve.outputs.mode == 'update'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout published data
        if: steps.resolve.outputs.mode == 'verify'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: verified-data
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Repair and verify update pipeline
        if: steps.resolve.outputs.mode == 'update'
        run: python scripts/update.py --repair-pipeline-only

      - name: Prepare exact native Scripture horizon
        if: steps.resolve.outputs.mode == 'update'
        run: |
          python scripts/prepare_rolling_week_scripture_slice.py \
            --start-date "${{ steps.resolve.outputs.date }}" \
            --days "${{ steps.resolve.outputs.window_days }}"

      - name: Generate and validate moving horizon without signing key
        if: steps.resolve.outputs.mode == 'update'
        run: |
          python scripts/update.py \
            --date "${{ steps.resolve.outputs.date }}" \
            --window-days "${{ steps.resolve.outputs.window_days }}" \
            --unsigned \
            --skip-scripture-preparation
          python scripts/validate_daily_ui_localizations.py data/calendar/today.json
          python scripts/validate_jordan_liturgical_contract.py data/calendar/today.json --expected-date "${{ steps.resolve.outputs.date }}" --require-jordan-authority --require-complete-liturgy
          python scripts/validate_source_intelligence.py data/calendar/today.json --expected-date "${{ steps.resolve.outputs.date }}"
          python scripts/validate_source_comparison.py --start-date "${{ steps.resolve.outputs.date }}"

      - name: Clear only today's language-lane publication slots
        if: steps.resolve.outputs.mode == 'update'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "data/daily/${{ steps.resolve.outputs.date }}" data/daily/current
          mkdir -p "data/daily/${{ steps.resolve.outputs.date }}" data/daily/current

      - name: Update Arabic lane — Amman and Jerusalem
        id: lane_ar
        if: steps.resolve.outputs.mode == 'update'
        continue-on-error: true
        run: python scripts/update_language_lane.py --language ar --date "${{ steps.resolve.outputs.date }}" --unsigned

      - name: Update Greek lane — official Greek Orthodox sources
        id: lane_el
        if: steps.resolve.outputs.mode == 'update'
        continue-on-error: true
        run: python scripts/update_language_lane.py --language el --date "${{ steps.resolve.outputs.date }}" --unsigned

      - name: Update English lane — Jerusalem and official Greek Orthodox sources
        id: lane_en
        if: steps.resolve.outputs.mode == 'update'
        continue-on-error: true
        run: python scripts/update_language_lane.py --language en --date "${{ steps.resolve.outputs.date }}" --unsigned

      - name: Require all three publishable language lanes
        if: steps.resolve.outputs.mode == 'update'
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          [[ "${{ steps.lane_ar.outcome }}" == success ]] && ok=$((ok+1))
          [[ "${{ steps.lane_el.outcome }}" == success ]] && ok=$((ok+1))
          [[ "${{ steps.lane_en.outcome }}" == success ]] && ok=$((ok+1))
          test "$ok" -eq 3 || { echo "All three language lanes must pass together; got $ok/3" >&2; exit 1; }
          echo "Publishable language lanes: 3/3"

      - name: Remove incomplete outputs from failed language lanes
        if: steps.resolve.outputs.mode == 'update'
        shell: bash
        run: |
          set -euo pipefail
          DATE="${{ steps.resolve.outputs.date }}"
          [[ "${{ steps.lane_ar.outcome }}" == success ]] || rm -f "data/daily/$DATE/ar.json" "data/daily/$DATE/ar.json.sig" data/daily/current/ar.json data/daily/current/ar.json.sig
          [[ "${{ steps.lane_el.outcome }}" == success ]] || rm -f "data/daily/$DATE/el.json" "data/daily/$DATE/el.json.sig" data/daily/current/el.json data/daily/current/el.json.sig
          [[ "${{ steps.lane_en.outcome }}" == success ]] || rm -f "data/daily/$DATE/en.json" "data/daily/$DATE/en.json.sig" data/daily/current/en.json data/daily/current/en.json.sig

      - name: Validate unsigned language lanes independently
        if: steps.resolve.outputs.mode == 'update'
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ steps.lane_ar.outcome }}" != success ]] || python scripts/verify_language_lanes.py --date "${{ steps.resolve.outputs.date }}" --language ar --unsigned
          [[ "${{ steps.lane_el.outcome }}" != success ]] || python scripts/verify_language_lanes.py --date "${{ steps.resolve.outputs.date }}" --language el --unsigned
          [[ "${{ steps.lane_en.outcome }}" != success ]] || python scripts/verify_language_lanes.py --date "${{ steps.resolve.outputs.date }}" --language en --unsigned

      - name: Require one consistent unsigned publication date
        if: steps.resolve.outputs.mode == 'update'
        run: python scripts/validate_publication_consistency.py --expected-date "${{ steps.resolve.outputs.date }}" --unsigned

      - name: Automated religious evidence and cross-source decision gate
        if: steps.resolve.outputs.mode == 'update'
        shell: bash
        run: |
          set -euo pipefail
          DATE="${{ steps.resolve.outputs.date }}"
          python scripts/validate_calendar_immutability.py
          python scripts/validate_source_comparison.py --start-date "$DATE"
          python scripts/validate_automated_religious_evidence.py \
            --start-date "$DATE" \
            --days "${{ steps.resolve.outputs.window_days }}" \
            --daily data/calendar/today.json
          for LANG in ar el en; do
            test ! -f "data/daily/$DATE/$LANG.json" || \
              python scripts/validate_automated_religious_evidence.py \
                --start-date "$DATE" \
                --days "${{ steps.resolve.outputs.window_days }}" \
                --daily "data/daily/$DATE/$LANG.json" \
                --language "$LANG"
          done
          python scripts/validate_strict_religious_content.py \
            data/calendar/today.json \
            --expected-date "$DATE" \
            --require-complete \
            --report release/strict-religious-content-audit.md
          cat release/strict-religious-content-audit.md >> "$GITHUB_STEP_SUMMARY"
          cat data/sources/comparison/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare publication worktree before restoring key
        if: steps.resolve.outputs.mode == 'update'
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$RUNNER_TEMP/verified-data"
          rm -rf "$TARGET"
          git fetch origin "$VERIFIED_DATA_BRANCH" || true
          if git show-ref --verify --quiet "refs/remotes/origin/$VERIFIED_DATA_BRANCH"; then
            git worktree add --force --detach "$TARGET" "origin/$VERIFIED_DATA_BRANCH"
          else
            git worktree add --force --detach "$TARGET" HEAD
          fi
          echo "PUBLICATION_TARGET=$TARGET" >> "$GITHUB_ENV"

      - name: Compare source health with previous publication
        if: steps.resolve.outputs.mode == 'update'
        shell: bash
        run: |
          set -euo pipefail
          PREVIOUS="$PUBLICATION_TARGET/data/sources/health/current.json"
          if [[ ! -f "$PREVIOUS" ]]; then
            mkdir -p "$(dirname "$PREVIOUS")"
            printf '{"observations":[]}\n' > "$PREVIOUS"
          fi
          python scripts/compare_source_snapshots.py \
            --current data/sources/health/current.json \
            --previous "$PREVIOUS" \
            --output data/sources/comparison/source-drift.json
          {
            echo ""
            echo "## Source structure drift"
            echo '```json'
            cat data/sources/comparison/source-drift.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve complete same-day language lanes
        if: steps.resolve.outputs.mode == 'update'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/preserve_same_day_language_lanes.py \
            --candidate-root "$GITHUB_WORKSPACE/data" \
            --published-root "$PUBLICATION_TARGET/data" \
            --date "${{ steps.resolve.outputs.date }}"
          for LANG in ar el en; do
            test ! -f "data/daily/current/$LANG.json" || \
              python scripts/verify_language_lanes.py \
                --date "${{ steps.resolve.outputs.date }}" \
                --language "$LANG" \
                --unsigned
          done
          python scripts/validate_publication_consistency.py \
            --expected-date "${{ steps.resolve.outputs.date }}" \
            --unsigned

      - name: Restore and match the one signing key
        if: steps.resolve.outputs.mode == 'update'
        shell: bash
        env:
          DATA_SIGNING_PRIVATE_KEY_B64: ${{ secrets.DATA_SIGNING_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          test -n "$DATA_SIGNING_PRIVATE_KEY_B64" || { echo "DATA_SIGNING_PRIVATE_KEY_B64 is required" >&2; exit 1; }
          printf '%s' "$DATA_SIGNING_PRIVATE_KEY_B64" | base64 --decode > "$RUNNER_TEMP/data-private.pem"
          chmod 600 "$RUNNER_TEMP/data-private.pem"
          openssl pkey -in "$RUNNER_TEMP/data-private.pem" -check -noout
          openssl pkey -in "$RUNNER_TEMP/data-private.pem" -pubout -out "$RUNNER_TEMP/derived-public.pem"
          openssl pkey -pubin -in canonical/signing/data_signing_public_key.pub -outform DER -out "$RUNNER_TEMP/committed.der"
          openssl pkey -pubin -in "$RUNNER_TEMP/derived-public.pem" -outform DER -out "$RUNNER_TEMP/derived.der"
          cmp -s "$RUNNER_TEMP/committed.der" "$RUNNER_TEMP/derived.der" || {
            echo "The GitHub secret does not match the public key committed in the app." >&2
            echo "Replace DATA_SIGNING_PRIVATE_KEY_B64 with the v4 key supplied with this release." >&2
            exit 1
          }

      - name: Sign and verify generated data
        if: steps.resolve.outputs.mode == 'update'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/sign_daily_data.py --private-key "$RUNNER_TEMP/data-private.pem"
          python scripts/verify_data_signature.py
          python scripts/sign_language_lanes.py --date "${{ steps.resolve.outputs.date }}" --private-key "$RUNNER_TEMP/data-private.pem"
          python scripts/verify_language_lanes.py --date "${{ steps.resolve.outputs.date }}"
          python scripts/validate_publication_consistency.py --expected-date "${{ steps.resolve.outputs.date }}"
          python scripts/build_update_manifest.py --date "${{ steps.resolve.outputs.date }}" --revision "${{ steps.resolve.outputs.revision }}"
          python scripts/sign_update_manifest.py --private-key "$RUNNER_TEMP/data-private.pem"
          python scripts/verify_update_manifest.py --expected-date "${{ steps.resolve.outputs.date }}"

      - name: Assemble and sign exact publication tree
        if: steps.resolve.outputs.mode == 'update'
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$GITHUB_WORKSPACE"
          TARGET="$PUBLICATION_TARGET"
          mkdir -p "$TARGET/data" "$TARGET/app/src/main/assets/data"
          rsync -a --delete "$SOURCE/data/" "$TARGET/data/"
          rsync -a --delete "$SOURCE/app/src/main/assets/data/" "$TARGET/app/src/main/assets/data/"
          # Defense in depth: clean the assembled publication tree itself before
          # signing and strict verification, even if the source cleanup changes.
          python "$SOURCE/scripts/clean_legacy_calendar_snapshots.py" --root "$TARGET"
          cp "$SOURCE/requirements-dev.txt" "$TARGET/requirements-dev.txt"
          cp "$SOURCE/.gitattributes" "$TARGET/.gitattributes"
          mkdir -p "$TARGET/scripts" "$TARGET/canonical/signing"
          # Keep the publication verifier self-contained. A whitelist previously
          # omitted a transitive validator and allowed generation/signing to pass
          # before the assembled publication tree failed verification.
          rsync -a --delete "$SOURCE/scripts/" "$TARGET/scripts/"
          test -f "$TARGET/scripts/verify.py"
          test -f "$TARGET/scripts/verify_language_lanes.py"
          test -f "$TARGET/scripts/validate_rolling_week.py"
          test -f "$TARGET/scripts/validate_reader_services.py"
          cp "$SOURCE/canonical/signing/data_signing_public_key.pub" "$TARGET/canonical/signing/"
          cp "$SOURCE/canonical/jordan_liturgical_contract.json" "$SOURCE/canonical/update_contract.json" "$SOURCE/canonical/source_connectors.json" "$SOURCE/canonical/source_comparison_policy.json" "$TARGET/canonical/"

          cd "$TARGET"
          python scripts/sign_daily_data.py --private-key "$RUNNER_TEMP/data-private.pem"
          python scripts/sign_language_lanes.py --date "${{ steps.resolve.outputs.date }}" --private-key "$RUNNER_TEMP/data-private.pem"
          python scripts/validate_publication_consistency.py --expected-date "${{ steps.resolve.outputs.date }}"
          python scripts/build_update_manifest.py --date "${{ steps.resolve.outputs.date }}" --revision "${{ steps.resolve.outputs.revision }}"
          python scripts/sign_update_manifest.py --private-key "$RUNNER_TEMP/data-private.pem"
          python scripts/verify_update_manifest.py --expected-date "${{ steps.resolve.outputs.date }}"
          python scripts/verify.py --expected-date "${{ steps.resolve.outputs.date }}"
          python scripts/validate_jordan_liturgical_contract.py data/calendar/today.json --expected-date "${{ steps.resolve.outputs.date }}" --require-jordan-authority --require-complete-liturgy
          python scripts/validate_source_intelligence.py data/calendar/today.json --expected-date "${{ steps.resolve.outputs.date }}"
          python scripts/validate_source_comparison.py --start-date "${{ steps.resolve.outputs.date }}"

      - name: Remove private key before commit or network publication
        if: ${{ always() && steps.resolve.outputs.mode == 'update' }}
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/data-private.pem" "$RUNNER_TEMP/derived-public.pem" "$RUNNER_TEMP/committed.der" "$RUNNER_TEMP/derived.der"

      - name: Commit, verify Git blobs, and publish verified-data
        if: steps.resolve.outputs.mode == 'update'
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$PUBLICATION_TARGET"
          cd "$TARGET"
          test ! -e "$RUNNER_TEMP/data-private.pem"
          git checkout -B "$VERIFIED_DATA_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Publish daily data ${{ steps.resolve.outputs.date }}"

          COMMIT_CHECK="$RUNNER_TEMP/verified-data-commit-check"
          rm -rf "$COMMIT_CHECK"
          mkdir -p "$COMMIT_CHECK"
          git archive HEAD | tar -x -C "$COMMIT_CHECK"
          cd "$COMMIT_CHECK"
          python scripts/verify.py --expected-date "${{ steps.resolve.outputs.date }}"
          python scripts/validate_source_intelligence.py data/calendar/today.json --expected-date "${{ steps.resolve.outputs.date }}"
          python scripts/validate_source_comparison.py --start-date "${{ steps.resolve.outputs.date }}"
          cd "$TARGET"
          git push --force-with-lease origin "HEAD:$VERIFIED_DATA_BRANCH"

      - name: Verify from origin after publishing
        if: steps.resolve.outputs.mode == 'update'
        shell: bash
        run: |
          set -euo pipefail
          CHECK="$RUNNER_TEMP/published-check"
          git clone --depth 1 --branch "$VERIFIED_DATA_BRANCH" "https://github.com/$GITHUB_REPOSITORY.git" "$CHECK"
          cd "$CHECK"
          python scripts/verify.py --expected-date "${{ steps.resolve.outputs.date }}"
          python scripts/validate_source_intelligence.py data/calendar/today.json --expected-date "${{ steps.resolve.outputs.date }}"
          python scripts/validate_source_comparison.py --start-date "${{ steps.resolve.outputs.date }}"

      - name: Verify public HTTPS update endpoint
        if: steps.resolve.outputs.mode == 'update'
        shell: bash
        run: |
          python scripts/verify_public_update_endpoints.py \
            --expected-date "${{ steps.resolve.outputs.date }}" \
            --attempts 8 \
            --delay-seconds 10

      - name: Verify scheduled publication
        if: steps.resolve.outputs.mode == 'verify'
        shell: bash
        run: |
          python scripts/verify.py --expected-date "${{ steps.resolve.outputs.date }}"
          python scripts/validate_source_intelligence.py data/calendar/today.json --expected-date "${{ steps.resolve.outputs.date }}"
          python scripts/validate_source_comparison.py --start-date "${{ steps.resolve.outputs.date }}"

      - name: Close recovered source-update alert
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Orthodox rolling-window update failed"
          EXISTING="$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')"
          if [[ -n "$EXISTING" ]]; then
            gh issue comment "$EXISTING" --body "Automated source research and publication recovered on ${{ steps.resolve.outputs.date }}. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            gh issue close "$EXISTING" --reason completed
          fi

      - name: Open failure alert
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Orthodox rolling-window update failed"
          BODY="Update/verification failed for ${{ steps.resolve.outputs.date }}. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [[ -f data/sources/comparison/summary.md ]]; then
            BODY="$BODY"$'\n\n'"$(cat data/sources/comparison/summary.md)"
          fi
          EXISTING="$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')"
          if [[ -n "$EXISTING" ]]; then gh issue comment "$EXISTING" --body "$BODY"; else gh issue create --title "$TITLE" --body "$BODY"; fi
