name: Build Windows Cleaner

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  PACKAGE_VERSION: "2.4.0"

jobs:
  build-modern:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Remove obsolete source files from older checkouts
        shell: pwsh
        run: ./remove-obsolete-v17.ps1 -Quiet

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Validate release configuration
        shell: pwsh
        run: ./scripts/validate-release.ps1

      - name: Restore modern application and tests
        shell: pwsh
        run: |
          dotnet restore src/SafeWindowsCleaner/SafeWindowsCleaner.csproj
          dotnet restore tests/SafeWindowsCleaner.SafetyTests/SafeWindowsCleaner.SafetyTests.csproj

      - name: Build modern application and safety tests
        shell: pwsh
        run: |
          dotnet build src/SafeWindowsCleaner/SafeWindowsCleaner.csproj `
            --configuration Release `
            --no-restore `
            -p:ContinuousIntegrationBuild=true `
            -p:GitHubRepository="${{ github.repository }}"
          dotnet build tests/SafeWindowsCleaner.SafetyTests/SafeWindowsCleaner.SafetyTests.csproj `
            --configuration Release `
            --no-restore `
            -p:ContinuousIntegrationBuild=true `
            -p:GitHubRepository="${{ github.repository }}"

      - name: Run Windows safety tests
        shell: pwsh
        run: |
          dotnet run `
            --project tests/SafeWindowsCleaner.SafetyTests/SafeWindowsCleaner.SafetyTests.csproj `
            --configuration Release `
            --no-build

      - name: Restore modern runtime assets
        shell: pwsh
        run: |
          dotnet restore src/SafeWindowsCleaner/SafeWindowsCleaner.csproj --runtime win-x64 -p:SelfContained=true
          dotnet restore src/SafeWindowsCleaner/SafeWindowsCleaner.csproj --runtime win-x86 -p:SelfContained=true

      - name: Publish Windows 10 and 11 x64 and x86
        shell: pwsh
        run: |
          foreach ($rid in @("win-x64", "win-x86")) {
            dotnet publish src/SafeWindowsCleaner/SafeWindowsCleaner.csproj `
              --configuration Release `
              --runtime $rid `
              --self-contained true `
              --no-restore `
              -p:PublishSingleFile=false `
              -p:IncludeNativeLibrariesForSelfExtract=false `
              -p:EnableCompressionInSingleFile=false `
              -p:ContinuousIntegrationBuild=true `
              -p:GitHubRepository="${{ github.repository }}" `
              --output "publish/$rid"
            if ($LASTEXITCODE -ne 0) { throw "Publish failed for $rid." }
            Copy-Item "PACKAGE-SELECTION-AR-EN.txt" "publish/$rid/PACKAGE-SELECTION-AR-EN.txt" -Force
          }

      - name: Initialize modern signing metadata
        shell: pwsh
        run: |
          "SIGNED_BUILD=false" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Sign modern applications when configured
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) {
            Write-Host "No signing certificate configured. Unsigned build will continue."
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw "WINDOWS_CERTIFICATE_PASSWORD is required."
          }

          $certPath = Join-Path $env:RUNNER_TEMP "SafeWindowsCleaner-signing.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "signtool.exe was not found." }
          $timestampUrl = if ([string]::IsNullOrWhiteSpace($env:WINDOWS_TIMESTAMP_URL)) { "http://timestamp.digicert.com" } else { $env:WINDOWS_TIMESTAMP_URL }

          foreach ($exe in @("publish\win-x64\SafeWindowsCleaner.exe", "publish\win-x86\SafeWindowsCleaner.exe")) {
            & $signtool sign /fd SHA256 /td SHA256 /tr $timestampUrl /f $certPath /p $env:WINDOWS_CERTIFICATE_PASSWORD $exe
            if ($LASTEXITCODE -ne 0) { throw "Application signing failed: $exe" }
            & $signtool verify /pa /v $exe
            if ($LASTEXITCODE -ne 0) { throw "Application signature verification failed: $exe" }
          }

          "SIGNED_BUILD=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SIGNTOOL_PATH=$signtool" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SIGNING_CERT_PATH=$certPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SIGNING_TIMESTAMP_URL=$timestampUrl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create modern portable ZIP packages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive -Path publish/win-x64/* -DestinationPath "dist/SafeWindowsCleaner-2.4.0-Win10-11-x64-Portable.zip" -Force
          Compress-Archive -Path publish/win-x86/* -DestinationPath "dist/SafeWindowsCleaner-2.4.0-Win10-11-x86-Portable.zip" -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build modern Setup packages
        shell: pwsh
        run: |
          $searchRoots = @(${env:ProgramFiles(x86)}, $env:ProgramFiles) | Where-Object { $_ -and (Test-Path $_) }
          $iscc = $searchRoots | ForEach-Object {
            Get-ChildItem $_ -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match 'Inno Setup [67]\\ISCC\.exe$' }
          } | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) { throw "ISCC.exe was not found." }
          Write-Host "Using Inno Setup compiler: $iscc"
          foreach ($script in @("installer\SafeWindowsCleaner.iss", "installer\SafeWindowsCleaner.x86.iss")) {
            & $iscc $script
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed for $script with exit code $LASTEXITCODE." }
          }

      - name: Smoke test modern Setup packages
        shell: pwsh
        timeout-minutes: 15
        run: |
          function Test-SetupPackage([string]$setupPath, [string]$suffix) {
            $setup = (Resolve-Path $setupPath).Path
            $installDir = Join-Path $env:RUNNER_TEMP "SafeWindowsCleaner-$suffix-Smoke"
            $installLog = Join-Path $env:RUNNER_TEMP "SafeWindowsCleaner-$suffix-install.log"
            Remove-Item $installDir -Recurse -Force -ErrorAction SilentlyContinue

            $arguments = @(
              "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/NOCANCEL",
              "/LANG=en", "/DIR=`"$installDir`"", "/LOG=`"$installLog`""
            )
            $install = Start-Process -FilePath $setup -ArgumentList $arguments -PassThru
            if (-not $install.WaitForExit(180000)) {
              Stop-Process -Id $install.Id -Force -ErrorAction SilentlyContinue
              if (Test-Path $installLog) { Get-Content $installLog | Select-Object -Last 120 }
              throw "$suffix Setup installation exceeded the 3-minute timeout."
            }
            if ($install.ExitCode -ne 0) {
              if (Test-Path $installLog) { Get-Content $installLog | Select-Object -Last 120 }
              throw "$suffix Setup installation failed with exit code $($install.ExitCode)."
            }

            $installedExe = Join-Path $installDir "SafeWindowsCleaner.exe"
            if (-not (Test-Path $installedExe) -or (Get-Item $installedExe).Length -le 0) {
              throw "$suffix Setup did not install a valid application executable."
            }
            $languageValue = (Get-ItemProperty -Path "HKCU:\Software\SafeWindowsCleaner" -Name LanguageCode -ErrorAction Stop).LanguageCode
            if ($languageValue -ne "en") { throw "$suffix Setup did not persist the selected language." }

            # Prove that an upgrade replaces stale files instead of leaving an old copy beside the new build.
            $staleFile = Join-Path $installDir "obsolete-from-old-version.tmp"
            "stale" | Set-Content $staleFile -Encoding ascii
            $upgradeLog = Join-Path $env:RUNNER_TEMP "SafeWindowsCleaner-$suffix-upgrade.log"
            $upgradeArguments = @(
              "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/NOCANCEL",
              "/LANG=en", "/DIR=`"$installDir`"", "/LOG=`"$upgradeLog`""
            )
            $upgrade = Start-Process -FilePath $setup -ArgumentList $upgradeArguments -PassThru
            if (-not $upgrade.WaitForExit(180000)) {
              Stop-Process -Id $upgrade.Id -Force -ErrorAction SilentlyContinue
              if (Test-Path $upgradeLog) { Get-Content $upgradeLog | Select-Object -Last 120 }
              throw "$suffix Setup upgrade exceeded the 3-minute timeout."
            }
            if ($upgrade.ExitCode -ne 0) {
              if (Test-Path $upgradeLog) { Get-Content $upgradeLog | Select-Object -Last 120 }
              throw "$suffix Setup upgrade failed with exit code $($upgrade.ExitCode)."
            }
            if (Test-Path $staleFile) { throw "$suffix Setup left a stale file from the previous version." }

            $uninstaller = Get-ChildItem $installDir -Filter "unins*.exe" -File | Select-Object -First 1
            if (-not $uninstaller) { throw "$suffix Setup did not create an uninstaller." }
            $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") -PassThru
            if (-not $uninstall.WaitForExit(180000)) {
              Stop-Process -Id $uninstall.Id -Force -ErrorAction SilentlyContinue
              Get-Process SafeWindowsCleaner -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
              throw "$suffix Setup uninstall exceeded the 3-minute timeout."
            }
            if ($uninstall.ExitCode -ne 0) { throw "$suffix Setup uninstall failed with exit code $($uninstall.ExitCode)." }
            $remainingLanguage = Get-ItemProperty -Path "HKCU:\Software\SafeWindowsCleaner" -Name LanguageCode -ErrorAction SilentlyContinue
            if ($null -ne $remainingLanguage) { throw "$suffix language registry value remained after uninstall." }

            for ($attempt = 0; $attempt -lt 20 -and (Test-Path $installDir); $attempt++) {
              Start-Sleep -Milliseconds 250
            }
            if (Test-Path $installDir) {
              $remainingFiles = @(Get-ChildItem $installDir -Recurse -Force -ErrorAction SilentlyContinue)
              if ($remainingFiles.Count -gt 0) {
                throw "$suffix uninstall left $($remainingFiles.Count) file(s) or folder(s) in the installation directory."
              }
              Remove-Item $installDir -Force -ErrorAction SilentlyContinue
            }
          }

          Test-SetupPackage "dist\SafeWindowsCleaner-2.4.0-Win10-11-x64-Setup.exe" "x64"
          Test-SetupPackage "dist\SafeWindowsCleaner-2.4.0-Win10-11-x86-Setup.exe" "x86"

      - name: Sign modern Setup packages when configured
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ($env:SIGNED_BUILD -ne "true") { exit 0 }
          foreach ($setup in @(
            "dist\SafeWindowsCleaner-2.4.0-Win10-11-x64-Setup.exe",
            "dist\SafeWindowsCleaner-2.4.0-Win10-11-x86-Setup.exe"
          )) {
            & $env:SIGNTOOL_PATH sign /fd SHA256 /td SHA256 /tr $env:SIGNING_TIMESTAMP_URL /f $env:SIGNING_CERT_PATH /p $env:WINDOWS_CERTIFICATE_PASSWORD $setup
            if ($LASTEXITCODE -ne 0) { throw "Setup signing failed: $setup" }
          }

      - name: Create modern checksums and build information
        shell: pwsh
        run: |
          $files = @(
            "SafeWindowsCleaner-2.4.0-Win10-11-x64-Portable.zip",
            "SafeWindowsCleaner-2.4.0-Win10-11-x86-Portable.zip",
            "SafeWindowsCleaner-2.4.0-Win10-11-x64-Setup.exe",
            "SafeWindowsCleaner-2.4.0-Win10-11-x86-Setup.exe"
          )
          foreach ($name in $files) {
            $path = Join-Path "dist" $name
            $hash = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name" | Set-Content "$path.sha256" -Encoding ascii
          }
          "Publisher: معن حنونة للستلايت" | Set-Content "dist/BUILD-INFO-MODERN.txt" -Encoding utf8
          "Version: 2.4.0" | Add-Content "dist/BUILD-INFO-MODERN.txt" -Encoding utf8
          "Systems: Windows 10/11 x64 and x86" | Add-Content "dist/BUILD-INFO-MODERN.txt" -Encoding utf8
          "Runtime: .NET 8 self-contained" | Add-Content "dist/BUILD-INFO-MODERN.txt" -Encoding utf8
          "Signed: $env:SIGNED_BUILD" | Add-Content "dist/BUILD-INFO-MODERN.txt" -Encoding utf8
          "Commit: $env:GITHUB_SHA" | Add-Content "dist/BUILD-INFO-MODERN.txt" -Encoding utf8

      - name: Upload modern build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: SafeWindowsCleaner-Lite-modern-assets
          path: |
            dist/SafeWindowsCleaner-2.4.0-Win10-11-x64-Portable.zip
            dist/SafeWindowsCleaner-2.4.0-Win10-11-x64-Portable.zip.sha256
            dist/SafeWindowsCleaner-2.4.0-Win10-11-x86-Portable.zip
            dist/SafeWindowsCleaner-2.4.0-Win10-11-x86-Portable.zip.sha256
            dist/SafeWindowsCleaner-2.4.0-Win10-11-x64-Setup.exe
            dist/SafeWindowsCleaner-2.4.0-Win10-11-x64-Setup.exe.sha256
            dist/SafeWindowsCleaner-2.4.0-Win10-11-x86-Setup.exe
            dist/SafeWindowsCleaner-2.4.0-Win10-11-x86-Setup.exe.sha256
            dist/BUILD-INFO-MODERN.txt
          if-no-files-found: error

      - name: Remove temporary modern signing certificate
        if: always()
        shell: pwsh
        run: |
          if ($env:SIGNING_CERT_PATH -and (Test-Path $env:SIGNING_CERT_PATH)) {
            Remove-Item $env:SIGNING_CERT_PATH -Force
          }

  build-win7-legacy:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET SDK for Legacy compilation
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Restore and build Windows Legacy application
        shell: pwsh
        run: |
          dotnet restore src/SafeWindowsCleaner.Win7/SafeWindowsCleaner.Win7.csproj
          dotnet build src/SafeWindowsCleaner.Win7/SafeWindowsCleaner.Win7.csproj `
            --configuration Release `
            --no-restore `
            -p:ContinuousIntegrationBuild=true

      - name: Stage Windows Legacy files
        shell: pwsh
        run: |
          $source = "src/SafeWindowsCleaner.Win7/bin/Release/net461"
          if (-not (Test-Path "$source/SafeWindowsCleaner.exe")) {
            throw "Windows Legacy executable was not produced."
          }
          New-Item -ItemType Directory -Path publish/win7 -Force | Out-Null
          Copy-Item "$source/*" publish/win7 -Recurse -Force
          Copy-Item "WINDOWS7-LEGACY-README-AR-EN.txt" "publish/win7/WINDOWS7-LEGACY-README-AR-EN.txt" -Force
          Copy-Item "PACKAGE-SELECTION-AR-EN.txt" "publish/win7/PACKAGE-SELECTION-AR-EN.txt" -Force

      - name: Initialize Legacy signing metadata
        shell: pwsh
        run: |
          "WIN7_SIGNED_BUILD=false" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Sign Windows Legacy application when configured
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) { exit 0 }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) { throw "WINDOWS_CERTIFICATE_PASSWORD is required." }
          $certPath = Join-Path $env:RUNNER_TEMP "SafeWindowsCleaner-win7-signing.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "signtool.exe was not found." }
          $timestampUrl = if ([string]::IsNullOrWhiteSpace($env:WINDOWS_TIMESTAMP_URL)) { "http://timestamp.digicert.com" } else { $env:WINDOWS_TIMESTAMP_URL }
          & $signtool sign /fd SHA256 /td SHA256 /tr $timestampUrl /f $certPath /p $env:WINDOWS_CERTIFICATE_PASSWORD "publish\win7\SafeWindowsCleaner.exe"
          if ($LASTEXITCODE -ne 0) { throw "Legacy application signing failed." }
          "WIN7_SIGNED_BUILD=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WIN7_SIGNTOOL_PATH=$signtool" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WIN7_SIGNING_CERT_PATH=$certPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WIN7_SIGNING_TIMESTAMP_URL=$timestampUrl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create Windows Legacy portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive -Path publish/win7/* -DestinationPath "dist/SafeWindowsCleaner-2.4.0-Windows7-8-8.1-Legacy-Portable.zip" -Force

      - name: Install Inno Setup for Legacy package
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build Windows Legacy Setup
        shell: pwsh
        run: |
          $searchRoots = @(${env:ProgramFiles(x86)}, $env:ProgramFiles) | Where-Object { $_ -and (Test-Path $_) }
          $iscc = $searchRoots | ForEach-Object {
            Get-ChildItem $_ -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match 'Inno Setup [67]\\ISCC\.exe$' }
          } | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) { throw "ISCC.exe was not found." }
          & $iscc "installer\SafeWindowsCleaner.Win7.iss"
          if ($LASTEXITCODE -ne 0) { throw "Windows 7/8/8.1 Setup compilation failed with exit code $LASTEXITCODE." }
          if (-not (Test-Path "dist\SafeWindowsCleaner-2.4.0-Windows7-8-8.1-Legacy-Setup.exe")) {
            throw "Windows 7/8/8.1 Setup output was not produced."
          }

      - name: Sign Windows Legacy Setup when configured
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ($env:WIN7_SIGNED_BUILD -ne "true") { exit 0 }
          $setup = "dist\SafeWindowsCleaner-2.4.0-Windows7-8-8.1-Legacy-Setup.exe"
          & $env:WIN7_SIGNTOOL_PATH sign /fd SHA256 /td SHA256 /tr $env:WIN7_SIGNING_TIMESTAMP_URL /f $env:WIN7_SIGNING_CERT_PATH /p $env:WINDOWS_CERTIFICATE_PASSWORD $setup
          if ($LASTEXITCODE -ne 0) { throw "Legacy Setup signing failed." }

      - name: Create Windows Legacy checksums and build information
        shell: pwsh
        run: |
          $files = @(
            "SafeWindowsCleaner-2.4.0-Windows7-8-8.1-Legacy-Portable.zip",
            "SafeWindowsCleaner-2.4.0-Windows7-8-8.1-Legacy-Setup.exe"
          )
          foreach ($name in $files) {
            $path = Join-Path "dist" $name
            $hash = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name" | Set-Content "$path.sha256" -Encoding ascii
          }
          "Edition: Windows 7/8/8.1 Legacy Lite" | Set-Content "dist/BUILD-INFO-WINDOWS7.txt" -Encoding utf8
          "Framework target: .NET Framework 4.6.1 (later compatible 4.x runtimes are accepted)" | Add-Content "dist/BUILD-INFO-WINDOWS7.txt" -Encoding utf8
          "Architectures: x86 and x64 through AnyCPU" | Add-Content "dist/BUILD-INFO-WINDOWS7.txt" -Encoding utf8
          "Version: 2.4.0" | Add-Content "dist/BUILD-INFO-WINDOWS7.txt" -Encoding utf8
          "Security note: Windows 7, Windows 8, and Windows 8.1 are outside current Microsoft support." | Add-Content "dist/BUILD-INFO-WINDOWS7.txt" -Encoding utf8
          "Signed: $env:WIN7_SIGNED_BUILD" | Add-Content "dist/BUILD-INFO-WINDOWS7.txt" -Encoding utf8

      - name: Upload Windows Legacy artifacts
        uses: actions/upload-artifact@v7
        with:
          name: SafeWindowsCleaner-Lite-Windows-Legacy-assets
          path: |
            dist/SafeWindowsCleaner-2.4.0-Windows7-8-8.1-Legacy-Portable.zip
            dist/SafeWindowsCleaner-2.4.0-Windows7-8-8.1-Legacy-Portable.zip.sha256
            dist/SafeWindowsCleaner-2.4.0-Windows7-8-8.1-Legacy-Setup.exe
            dist/SafeWindowsCleaner-2.4.0-Windows7-8-8.1-Legacy-Setup.exe.sha256
            dist/BUILD-INFO-WINDOWS7.txt
          if-no-files-found: error

      - name: Remove temporary Legacy signing certificate
        if: always()
        shell: pwsh
        run: |
          if ($env:WIN7_SIGNING_CERT_PATH -and (Test-Path $env:WIN7_SIGNING_CERT_PATH)) {
            Remove-Item $env:WIN7_SIGNING_CERT_PATH -Force
          }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-modern, build-win7-legacy]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download modern assets
        uses: actions/download-artifact@v8
        with:
          name: SafeWindowsCleaner-Lite-modern-assets
          path: dist

      - name: Download Windows Legacy assets
        uses: actions/download-artifact@v8
        with:
          name: SafeWindowsCleaner-Lite-Windows-Legacy-assets
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --title "Safe Windows Cleaner Lite ${{ github.ref_name }}" \
            --generate-notes
